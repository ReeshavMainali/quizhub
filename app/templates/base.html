<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}QuizHub{% endblock %}</title>

<script>
  // Applied before paint to avoid a light/dark flash on load.
  (function () {
    var stored = localStorage.getItem("quizhub-theme");
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = stored || (prefersDark ? "dark" : "light");
    if (theme === "dark") document.documentElement.classList.add("dark");
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
{% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-bg text-text font-body">

<nav class="border-b border-border bg-surface">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
    <a href="{{ url_for('main.dashboard') }}" class="flex items-center gap-2 font-display font-semibold text-lg">
      <span class="w-7 h-7 rounded-lg bg-primary flex items-center justify-center text-surface text-sm">Q</span>
      QuizHub
    </a>
    <button id="theme-toggle" type="button"
      class="btn-secondary !px-3 !py-2" aria-label="Toggle light and dark mode">
      <svg id="icon-sun" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="icon-moon" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="max-w-6xl mx-auto px-4 sm:px-6 pt-4 space-y-2">
      {% for category, message in messages %}
        <div class="rounded-lg px-4 py-2.5 text-sm border
          {{ 'bg-danger/10 border-danger/30 text-danger' if category == 'error' else
             'bg-success/10 border-success/30 text-success' if category == 'success' else
             'bg-primary/10 border-primary/30 text-primary' }}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
  {% block content %}{% endblock %}
</main>

<script>
  function applyIcons() {
    var isDark = document.documentElement.classList.contains("dark");
    document.getElementById("icon-sun").classList.toggle("hidden", !isDark);
    document.getElementById("icon-moon").classList.toggle("hidden", isDark);
  }
  applyIcons();
  document.getElementById("theme-toggle").addEventListener("click", function () {
    document.documentElement.classList.toggle("dark");
    localStorage.setItem("quizhub-theme", document.documentElement.classList.contains("dark") ? "dark" : "light");
    applyIcons();
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
